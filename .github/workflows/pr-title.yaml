# Checks the PR title is a Conventional Commit.
#
# Its own workflow, not a job in check.yaml, because it must rerun when a title is edited, and an edit event sharing that workflow's concurrency group cancels the code check in flight.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      # release-please builds the changelogs from squash-merge titles, so the PR title is the commit message that matters.
      # The title arrives through env, never interpolated into the script, so a crafted title cannot inject shell.
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert|style)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo "Expected <type>(<scope>)!: <description>, e.g. feat(ilttu): preview a design on localhost"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters, more than 72: $TITLE"
            exit 1
          fi
